const SG=[["全部",null],["東亞",["中國","臺灣","日本","朝鮮半島"]],["南亞・西亞",["印度","伊朗（波斯）","西亞（兩河流域到土耳其）"]],["歐洲",["希臘、巴爾幹","義大利","法國","德國","英國","西班牙、葡萄牙","俄羅斯"]],["非洲",["埃及","撒哈拉以南非洲"]],["美洲",["北美洲","中南美洲"]]];
const TYC={"合":"#7fbf8a","分":"#e8a0a0","外":"#c8ad7f","新":"#8fb3e8","":"#c9c4ba"};
const $=id=>document.getElementById(id);
const SEG=[[-3500,-500,.22,500],[-500,500,.75,100],[500,1400,.8,100],[1400,1700,2.4,50],[1700,2027,4,25]];
const PAD=24;
const y2p=y=>{let px=PAD;for(const[a,b,k]of SEG){if(y<=a)break;px+=(Math.min(y,b)-a)*k;if(y<=b)break}return px};
const p2y=px=>{let acc=PAD;for(const[a,b,k]of SEG){const h=(b-a)*k;if(px<=acc+h)return a+(px-acc)/k;acc+=h}return 2027};
const H=y2p(2027)+PAD;
const yLabel=y=>y<0?'前'+(-y):y>=2027?'今日':String(y);
const pOf=y=>y<-500?0:y<500?1:y<1400?2:y<1700?3:4;
const pc=['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)'];
let grp=0;
function cw(){return innerWidth>=900?84:56}
function render(){
 const LW=118,CW=cw(),regs=RG.filter(r=>!SG[grp][1]||SG[grp][1].includes(r[0]));
 document.documentElement.style.setProperty('--lw',LW+'px');document.documentElement.style.setProperty('--cw',CW+'px');
 const W=regs.length*CW;
 // left column
 let L='';
 P.forEach((p,i)=>{const a=SEG[i][0],b=SEG[i][1];L+=`<div class="band" style="top:${y2p(a)}px;height:${y2p(b)-y2p(a)}px;background:${pc[i]}"></div><div class="pl" style="top:${y2p(a)}px;background:${pc[i]}">${p.n}</div>`});
 const ev=C.map((c,i)=>({i,y:CY[i]})).filter(e=>e.y>=-3500).sort((a,b)=>a.y-b.y);
 const ticks=[];SEG.forEach(([a,b,,st])=>{for(let y=Math.ceil(a/st)*st;y<b;y+=st)if(y!==a)ticks.push(y)});
 const evPx=[];const gs=[];ev.forEach(e=>{const t=y2p(e.y),g=gs[gs.length-1];if(g&&t-g.t<24)g.ids.push(e.i);else gs.push({t,ids:[e.i]})});
 gs.forEach(g=>evPx.push(g.t));
 ticks.forEach(y=>{const t=y2p(y);if(!evPx.some(e=>Math.abs(e-t)<14))L+=`<div class="tk" style="top:${t}px">${yLabel(y)}</div>`});
 L+=gs.map(g=>`<button class="ev${g.ids.length>1?' m':''}" style="top:${g.t}px" data-i="${g.ids.join(',')}">● ${g.ids.length>1?g.ids.length+'件':CS[g.ids[0]]}</button>`).join('');
 // columns
 let B='';
 ticks.forEach(y=>B+=`<div class="hl" style="top:${y2p(y)}px"></div>`);
 SEG.forEach(([a],i)=>{if(i)B+=`<div class="hl pb" style="top:${y2p(a)}px;--pc:${pc[i]}"></div>`});
 regs.forEach((r,ci)=>{r[1].forEach((x,k)=>{const s=Math.max(x[0],-3500),e=Math.min(k+1<r[1].length?r[1][k+1][0]:2027,2027);if(e<=s)return;const top=y2p(s),h=Math.max(y2p(e)-top-2,3);
  B+=`<button class="bar" data-r="${RG.indexOf(r)}" data-k="${k}" style="left:${ci*CW+3}px;width:${CW-6}px;top:${top+1}px;height:${h}px;background:${TYC[x[4]||'']}" aria-label="${x[2]}（${x[1]}）">${h>34?`<span>${x[2]}</span>`:''}</button>`})});
 $('in').style.width=(LW+W)+'px';
 $('in').innerHTML=`<div class="hd"><div class="corner">年代／大事</div>${regs.map(r=>`<div class="rh">${r[0]}</div>`).join('')}</div><div class="row"><div class="lc" style="height:${H}px">${L}</div><div class="cols" style="width:${W}px;height:${H}px">${B}</div></div>`;
 $('in').querySelectorAll('.ev').forEach(b=>b.onclick=e=>{e.stopPropagation();const ids=b.dataset.i.split(',').map(Number);ids.length===1?evSheet(ids[0]):listSheet(ids)});
 $('in').querySelectorAll('.bar').forEach(b=>b.onclick=e=>{e.stopPropagation();barSheet(+b.dataset.r,+b.dataset.k)});
 placeMid();onScroll();
}
function show(h){$('sheet').innerHTML='<small class="c">點空白處關閉</small>'+h;$('sheet').hidden=false;$('sheet').scrollTop=0}
function evSheet(i){const c=C[i];show(`<h2>${c[2]}</h2><div class="y">${c[1]}・${P[pOf(CY[i])].n}</div><div class="r"><i>是什麼</i>${CW[i]}</div><div class="r"><i>為什麼</i>${c[3]}</div><div class="r"><i>造成</i>${c[4]}</div><div class="r"><i>今天</i>${c[5]}</div>${CT[i]?`<div class="r"><i>冷知識</i>${CT[i]}</div>`:''}`)}
function listSheet(ids){show(`<h2>這附近有 ${ids.length} 件事</h2>`+ids.map(i=>`<button class="li" data-i="${i}"><b>${C[i][2]}</b><span>${C[i][1]}</span></button>`).join(''));$('sheet').querySelectorAll('.li').forEach(x=>x.onclick=e=>{e.stopPropagation();evSheet(+x.dataset.i)})}
function barSheet(ri,k){const r=RG[ri],x=r[1][k],ty={"合":"統一","分":"分裂","外":"外來統治","新":"新政權"}[x[4]]||'';show(`<h2>${x[2]}</h2><div class="y">${r[0]}・${x[1]}${ty?'・'+ty:''}</div><div class="r">${x[3]}</div>`+(k+1<r[1].length?`<div class="r"><i>接著</i>${r[1][k+1][2]}（${r[1][k+1][1]}）</div>`:''))}
document.addEventListener('click',e=>{if(!e.target.closest('#sheet'))$('sheet').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').hidden=true});
function placeMid(){const r=$('tl').getBoundingClientRect();$('mid').style.top=(r.top+r.height*.45)+'px'}
function onScroll(){placeMid();const r=$('tl');const hd=r.querySelector('.hd');const y=Math.round(p2y(r.scrollTop+r.clientHeight*.45-(hd?hd.offsetHeight:0)));const yy=Math.max(-3500,Math.min(2026,y));const p=pOf(yy);
 $('now').innerHTML=`<b style="color:${pc[p]}">${yLabel(yy)}${yy<2027?'年':''}</b>${P[p].n}　紅線對到的年代；上下左右滑動，點色塊或事件看介紹`}
$('tl').addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',()=>{placeMid();render()});
function jump(y){const hd=$('tl').querySelector('.hd');$('tl').scrollTo({top:y2p(y)-$('tl').clientHeight*.45+(hd?hd.offsetHeight:0)+2,behavior:'smooth'})}
$('grp').innerHTML=SG.map((g,i)=>`<button data-i="${i}" aria-pressed="${i===grp}">${g[0]}</button>`).join('');
$('grp').querySelectorAll('button').forEach(b=>b.onclick=()=>{grp=+b.dataset.i;$('grp').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));const t=$('tl').scrollTop;render();$('tl').scrollTop=t});
$('per').innerHTML=P.map((p,i)=>`<button style="--pc:${pc[i]}" data-y="${SEG[i][0]}">${p.n}</button>`).join('')+`<button style="--pc:var(--ink)" data-y="2026">今天</button>`;
$('per').querySelectorAll('button').forEach(b=>b.onclick=()=>jump(+b.dataset.y+(+b.dataset.y===2026?0:1)));
$('leg').innerHTML=[['合','統一'],['分','分裂'],['外','外來統治'],['新','新政權'],['','其他']].map(([k,n])=>`<span><i style="background:${TYC[k]}"></i>${n}</span>`).join('');
render();
</script>
</body>
